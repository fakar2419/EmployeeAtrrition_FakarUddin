version: '3.8'

services:
  fastapi:
    build: .
    container_name: hr_attrition_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always

  streamlit:
    build: .
    container_name: hr_attrition_dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    restart: always
    depends_on:
      - fastapi
